name: release-variants
# Builds downloadable zips from the Google Drive mirror: full (everything) and core (without student-notes).
# Needs the secret RCLONE_CONF (contents of an rclone.conf with the `gdrive-arsiv` remote). Manual only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Download and zip
        run: |
          python -X utf8 tools/archive.py storage-pull --variant full
          for v in full core; do
            python -X utf8 tools/archive.py variant $v > files-$v.txt
            { echo README.md; echo catalog/curriculum.yaml; echo catalog/index.json; ls courses/*/README.md; } >> files-$v.txt
            zip -q -@ gazi-bm-mf-notlar-$v.zip < files-$v.txt
            ls -lh gazi-bm-mf-notlar-$v.zip
          done
      - uses: actions/upload-artifact@v4
        with:
          name: variants
          path: gazi-bm-mf-notlar-*.zip
