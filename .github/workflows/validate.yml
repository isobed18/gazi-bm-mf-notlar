name: validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Archive metadata validation (schema, names, duplicates)
        run: python -X utf8 tools/archive.py validate
      - name: No binary files in git (files belong on the Drive mirror; submit them via an issue)
        run: |
          bad=$(git ls-files courses general | grep -vE '\.(yaml|md)$|/\.gitkeep$' || true)
          if [ -n "$bad" ]; then echo "::error::binary/resource files committed:"; echo "$bad"; exit 1; fi
      - name: Index is up to date
        run: |
          python -X utf8 tools/archive.py index
          git diff --exit-code -- 'courses/*/README.md' || (echo "::error::run 'archive.py index' and commit the result"; exit 1)
