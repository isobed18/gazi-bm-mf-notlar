# Gazi University — Computer Engineering (Bilgisayar Mühendisliği) course catalog.
# Source: official 2024 curriculum ("2024-2025 Güz Döneminden İtibaren") + electives and
# legacy (pre-2024) courses that students in this archive actually took.
#
# Fields
#   code          canonical course code (folder name under courses/)
#   name_tr / name_en
#   semester      curriculum semester (1-8). null for electives offered in several semesters.
#   category      required | technical-elective | non-technical-elective | language | general | internship
#   curriculum    "2024" (current) or "legacy" (old curriculum, kept because material exists)
#   aliases       strings that identify this course in file names, chat messages, exam scans.
#                 Lower-case, without Turkish characters. Used by tools/archive.py for scoring.
#   replaced_by   for legacy courses: the 2024 course that covers the same content (if any)

